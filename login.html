<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบแอดมิน - iNO Shop</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        dark: '#050810',
                        card: '#0F1A2F',
                        primary: '#0099FF',
                        secondary: '#00CCFF',
                        danger: '#E53935',
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap');
        * { font-family: 'Noto Sans Thai', sans-serif; }
        body { background: #050810; position: relative; min-height: 100vh; }
        
        .stars-bg { position: fixed; inset: 0; overflow: hidden; z-index: -1; background: radial-gradient(ellipse at top, #0A1628 0%, #050810 60%, #000 100%); }
        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: floatTwinkle linear infinite;
        }
        @keyframes floatTwinkle {
            0%   { opacity: 0.15; transform: translateY(0px) scale(1); }
            25%  { opacity: 0.7;  transform: translateY(-8px) scale(1.1); }
            50%  { opacity: 1;    transform: translateY(-15px) scale(1.3); }
            75%  { opacity: 0.6;  transform: translateY(-7px) scale(1.1); }
            100% { opacity: 0.15; transform: translateY(0px) scale(1); }
        }
        
        .login-card {
            background: rgba(15, 26, 47, 0.85);
            border: 2px solid #0099FF;
            box-shadow: 0 0 30px rgba(0, 153, 255, 0.2);
            backdrop-filter: blur(10px);
        }
        .login-card:hover {
            border-color: #00CCFF;
            box-shadow: 0 0 40px rgba(0, 204, 255, 0.3);
        }
        .btn-primary {
            background: linear-gradient(180deg, #0099FF, #0077EE);
            border: 2px solid #00CCFF;
            transition: all 0.2s ease;
        }
        .btn-primary:hover {
            background: linear-gradient(180deg, #00AAFF, #0088FF);
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(0, 153, 255, 0.4);
        }
        .input-field {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(0, 153, 255, 0.4);
            transition: all 0.2s ease;
        }
        .input-field:focus {
            outline: none;
            border-color: #00CCFF;
            box-shadow: 0 0 10px rgba(0, 204, 255, 0.3);
        }
        .logo-text {
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(90deg, #0099FF, #00CCFF);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .error-msg {
            color: #EF5350;
            font-size: 14px;
            display: none;
        }
    </style>
</head>
<body class="text-white flex items-center justify-center min-h-screen px-4">

    <!-- ⭐ พื้นหลังดาว -->
    <div class="stars-bg">
        <div class="star" style="width:2px;height:2px;top:10%;left:8%;animation-duration:3s;"></div>
        <div class="star" style="width:1px;height:1px;top:15%;left:85%;animation-duration:4s;animation-delay:0.3s;"></div>
        <div class="star" style="width:2px;height:2px;top:25%;left:20%;animation-duration:3.5s;animation-delay:0.6s;"></div>
        <div class="star" style="width:1px;height:1px;top:30%;left:70%;animation-duration:4.2s;animation-delay:0.9s;"></div>
        <div class="star" style="width:2px;height:2px;top:42%;left:12%;animation-duration:3.8s;animation-delay:1.2s;"></div>
        <div class="star" style="width:1px;height:1px;top:50%;left:90%;animation-duration:4.5s;animation-delay:0.1s;"></div>
        <div class="star" style="width:2px;height:2px;top:60%;left:35%;animation-duration:3.2s;animation-delay:0.4s;"></div>
        <div class="star" style="width:1px;height:1px;top:70%;left:78%;animation-duration:4.8s;animation-delay:0.7s;"></div>
        <div class="star" style="width:3px;height:3px;top:78%;left:5%;animation-duration:3.6s;animation-delay:1s;"></div>
        <div class="star" style="width:1px;height:1px;top:85%;left:55%;animation-duration:4.1s;animation-delay:1.3s;"></div>
        <div class="star" style="width:2px;height:2px;top:8%;left:45%;animation-duration:3.9s;animation-delay:0.2s;"></div>
        <div class="star" style="width:2px;height:2px;top:20%;left:60%;animation-duration:3.4s;animation-delay:0.5s;"></div>
        <div class="star" style="width:1px;height:1px;top:55%;left:82%;animation-duration:4.6s;animation-delay:0.8s;"></div>
        <div class="star" style="width:2px;height:2px;top:68%;left:25%;animation-duration:3.3s;animation-delay:1.1s;"></div>
        <div class="star" style="width:1px;height:1px;top:90%;left:15%;animation-duration:4.3s;animation-delay:1.4s;"></div>
        <div class="star" style="width:2px;height:2px;top:12%;left:55%;animation-duration:3.7s;animation-delay:0.5s;"></div>
        <div class="star" style="width:1px;height:1px;top:38%;left:42%;animation-duration:4.4s;animation-delay:0.7s;"></div>
        <div class="star" style="width:3px;height:3px;top:82%;left:68%;animation-duration:3.1s;animation-delay:1s;"></div>
        <div class="star" style="width:1px;height:1px;top:5%;left:30%;animation-duration:4.7s;animation-delay:0.4s;"></div>
        <div class="star" style="width:2px;height:2px;top:92%;left:80%;animation-duration:3.8s;animation-delay:1.5s;"></div>
    </div>

    <!-- ฟอร์มเข้าสู่ระบบ -->
    <div class="login-card rounded-xl p-8 w-full max-w-md z-10">
        <div class="text-center mb-8">
            <h1 class="logo-text mb-2">iNO Shop</h1>
            <p class="text-gray-400">ระบบจัดการแอดมิน</p>
        </div>

        <form id="loginForm">
            <div class="mb-5">
                <label class="block text-gray-300 mb-2 text-sm">
                    <i class="fa fa-user mr-2 text-primary"></i>ชื่อผู้ใช้
                </label>
                <input type="text" id="username" class="input-field w-full px-4 py-3 rounded-lg text-white" placeholder="กรอกชื่อผู้ใช้" required>
            </div>

            <div class="mb-4">
                <label class="block text-gray-300 mb-2 text-sm">
                    <i class="fa fa-lock mr-2 text-primary"></i>รหัสผ่าน
                </label>
                <input type="password" id="password" class="input-field w-full px-4 py-3 rounded-lg text-white" placeholder="กรอกรหัสผ่าน" required>
            </div>

            <div id="errorMsg" class="error-msg text-center mb-4">
                <i class="fa fa-exclamation-circle mr-1"></i>ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง
            </div>

            <button type="submit" class="btn-primary w-full py-3 rounded-lg text-white font-semibold mb-4">
                <i class="fa fa-sign-in mr-2"></i>เข้าสู่ระบบ
            </button>

            <a href="index.html" class="block text-center text-gray-400 text-sm hover:text-primary transition-colors">
                <i class="fa fa-arrow-left mr-1"></i>กลับสู่หน้าหลัก
            </a>
        </form>
    </div>

    <script>
        const loginForm = document.getElementById('loginForm');
        const errorMsg = document.getElementById('errorMsg');
        
        // ข้อมูลแอดมิน
        const ADMIN_USER = 'iNOSHOP';
        const ADMIN_PASS = 'Piano08102556';

        loginForm.addEventListener('submit', function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            // ตรวจสอบความถูกต้อง
            if (username === ADMIN_USER && password === ADMIN_PASS) {
                // บันทึกสถานะการเข้าสู่ระบบ
                localStorage.setItem('inoAdminLoggedIn', 'true');
                // ซ่อนข้อความแจ้งเตือน
                errorMsg.style.display = 'none';
                // แจ้งความสำเร็จและไปหน้าแดชบอร์ด
                alert('✅ เข้าสู่ระบบสำเร็จ! ยินดีต้อนรับแอดมิน');
                window.location.href = 'admin-dashboard.html';
            } else {
                // แสดงข้อความผิดพลาด
                errorMsg.style.display = 'block';
                // ล้างรหัสผ่าน
                document.getElementById('password').value = '';
                document.getElementById('password').focus();
            }
        });
    </script>
</body>
</html>
